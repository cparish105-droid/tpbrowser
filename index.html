  /* ---------- block (A/B) rotation + special day schedules ---------- */
  function weekdaySeq(iso){
    // sequential index among Mon-Fri weekdays only, anchored to a fixed Monday; returns null for Sat/Sun
    const d = parseISO(iso);
    if(!d) return null;
    const epoch = new Date(2000,0,3); // a Monday
    const days = Math.round((d - epoch) / 86400000);
    const dow = ((days % 7) + 7) % 7; // 0=Mon..6=Sun relative to epoch Monday
    if(dow >= 5) return null;
    return Math.floor(days / 7) * 5 + dow;
  }
  function abLetterForDate(iso){
    const anchor = (state.settings && state.settings.abAnchor) || { date: todayISO(), letter:'A' };
    const wi = weekdaySeq(iso), wa = weekdaySeq(anchor.date);
    if(wi === null) return null; // weekend, no rotation day
    if(wa === null) return 'A';
    const letters = ['A','B'];
    let idx = letters.indexOf(anchor.letter); if(idx < 0) idx = 0;
    idx = (((idx + (wi - wa)) % 2) + 2) % 2;
    return letters[idx];
  }
  function specialDateEntry(iso){ return (state.specialDates||[]).find(x => x.date === iso) || null; }
  function getSpecialSchedule(id){ return (state.specialSchedules||[]).find(t => t.id === id) || null; }
  function scheduleDayOptions(){
    if(state.settings.scheduleMode === 'ab') return ['A','B'].map(d => `<option value="${d}">${d} day</option>`).join('');
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i) => `<option value="${i}">${d}</option>`).join('');
  }
  function dayLabelFor(day){
    if(typeof day === 'string') return day + ' day';
    const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return names[day] || '';
  }
  function compareDay(a,b){ return String(a).localeCompare(String(b)); }
  function scheduleForDate(iso){
    const sp = specialDateEntry(iso);
    if(sp){
      const tmpl = getSpecialSchedule(sp.templateId);
      if(!tmpl) return [];
      return tmpl.blocks.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(b => {
        const cls = b.classId ? getClass(b.classId) : null;
        return { name: cls ? cls.name : (b.label || 'Block'), start:b.start, end:b.end, color: cls ? cls.color : 'var(--muted)', special:true, specialName: tmpl.name };
      });
    }
    const rows = [];
    if(state.settings.scheduleMode === 'ab'){
      const letter = abLetterForDate(iso);
      if(!letter) return rows;
      state.classes.forEach(c => (c.schedule||[]).forEach(s => { if(s.day === letter) rows.push({ name:c.name, start:s.start, end:s.end, color:c.color }); }));
    } else {
      const d = parseISO(iso); if(!d) return rows;
      const dow = d.getDay();
      state.classes.forEach(c => (c.schedule||[]).forEach(s => { if(s.day === dow) rows.push({ name:c.name, start:s.start, end:s.end, color:c.color }); }));
    }
    rows.sort((a,b)=> a.start.localeCompare(b.start));
    return rows;
  }
  function todaysSchedule(){ return scheduleForDate(todayISO()); }
  function dayTypeLabel(iso){
    const sp = specialDateEntry(iso);
    if(sp){ const tmpl = getSpecialSchedule(sp.templateId); return tmpl ? tmpl.name : null; }
    if(state.settings.scheduleMode === 'ab'){ const l = abLetterForDate(iso); return l ? l + ' day' : null; }
    return null;
  }
  function nextClassToday(){
    const now = nowHM();
    const upcoming = todaysSchedule().filter(s => s.start >= now);
    return upcoming[0] || null;
  }

  function computeStreak(){
    // count consecutive days (including today) with at least one assignment completed or study session finished
    let streak = 0;
    for(let i=0;i<365;i++){
      const iso = fmtISO(addDays(todayDate(), -i));
      const hasCompletion = state.assignments.some(a => isDone(a) && a.modified && fmtISO(new Date(a.modified)) === iso)
        || state.studySessions.some(s => s.completed && s.date === iso);
      if(hasCompletion) streak++;
      else if(i===0) continue; // today might just not have one yet, don't break streak on day 0
      else break;
    }
    return streak;
  }

  /* =========================================================
     PLAN MY DAY
     ========================================================= */
  function renderPlanMyDay(container, silent){
    const iso = todayISO();
    let plan = state.planMyDay && state.planMyDay.date === iso ? state.planMyDay : generatePlan(iso);
    state.planMyDay = plan;
    saveState();
    drawPlan(container, plan);
    if(!silent) toast('Plan generated');
  }

  function generatePlan(iso){
    const candidates = whatsNext(8).filter(x => !x.a.due || daysBetweenISO(iso, x.a.due) <= 7);
    const busy = [];
    todaysSchedule().forEach(s => busy.push({ start:s.start, end:s.end }));
    state.studySessions.filter(s=>s.date===iso).forEach(s => busy.push({ start:s.startTime, end: addMinutesToTime(s.startTime, s.durationMin) }));

    function overlaps(start, end){
      return busy.some(b => start < b.end && end > b.start);
    }
    function toMin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
    function toHM(min){ return pad2(Math.floor((min%1440)/60)) + ':' + pad2(min%60); }

    const dayStartMin = Math.max(toMin(nowHM()) + 10, toMin('15:30')); // after "now" and not before mid-afternoon by default
    let cursor = dayStartMin;
    const dayEnd = toMin('21:00');
    const blocks = [];
    for(const { a, s } of candidates){
      if(blocks.length >= 5) break;
      const dur = a.estimate || state.settings.defaultDuration || 30;
      let start = cursor;
      let attempts = 0;
      while(overlaps(toHM(start), toHM(start+dur)) && attempts < 20){ start += 15; attempts++; }
      const end = start + dur;
      if(end > dayEnd) continue;
      blocks.push({ id: uid(), assignmentId: a.id, title: a.title, subject: subjectLabel(a), start: toHM(start), end: toHM(end), reasons: s.reasons });
      busy.push({ start: toHM(start), end: toHM(end) });
      cursor = end + 10;
    }
    return { date: iso, blocks };
  }

  function drawPlan(container, plan){
    if(!plan.blocks.length){
      container.innerHTML = `<p class="empty-state">Nothing urgent to schedule — enjoy the free time, or check Assignments for anything further out.</p>`;
      return;
    }
    container.innerHTML = `<div id="planBlocks">` + plan.blocks.map((b,i) => `
      <div class="next-item" data-idx="${i}">
        <span class="next-rank mono">${fmtTime12(b.start)}</span>
        <div class="next-body">
          <div class="next-title">${escapeHtml(b.subject ? b.subject + ' — ' : '')}${escapeHtml(b.title)} <span class="settings-row-hint">(${fmtTime12(b.start)}&ndash;${fmtTime12(b.end)})</span></div>
          <div class="next-reason">${b.reasons.join(', ')}</div>
        </div>
        <button class="task-delete" aria-label="Remove from plan" data-remove="${i}">&times;</button>
      </div>`).join('') + `</div>`;
    qsa('[data-remove]', container).forEach(btn => btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.remove);
      plan.blocks.splice(idx,1);
      state.planMyDay = plan; saveState();
      drawPlan(container, plan);
    }));
  }

  /* ---------- smart quick-add ---------- */
  const QA_STOP = new Set(['of','the','and','a','an','to','for','in','on','at','by','due','is','my','class','i','have','got','need','with']);
  const QA_DAY_ABBR = { sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2, wed:3, weds:3, wednesday:3, thu:4, thur:4, thurs:4, thursday:4, fri:5, friday:5, sat:6, saturday:6 };
  const QA_TYPES = [
    { re:/^(test|tests|exam|exams|midterm|midterms|final|finals)$/, type:'test', exam:true },
    { re:/^(quiz|quizzes)$/, type:'quiz' },
    { re:/^(homework|hw|worksheet|worksheets)$/, type:'homework' },
    { re:/^(essay|essays|paper)$/, type:'essay' },
    { re:/^(project|proj)$/, type:'project' },
    { re:/^(lab|labs)$/, type:'lab' },
    { re:/^(reading|read)$/, type:'reading' }
  ];

  function qaNextWeekday(dow, mod){
    const t = todayDate();
    let delta = (dow - t.getDay() + 7) % 7;
    if(delta === 0) delta = 7;
    if(mod === 'next'){
      const endOfWeek = (7 - t.getDay()) % 7; // days until Sunday
      if(delta <= endOfWeek) delta += 7;
    }
    return fmtISO(addDays(t, delta));
  }

  const QA_CLASS_FILLER = new Set(['ap','ib','honors','honor','hon','cp','accelerated','intro','introduction','advanced','adv','regular','basic','i','ii','iii','iv','of','the','and','a','an','to','for','in']);
  const QA_GROUPS = [
    ['math','maths','mathematics','algebra','geometry','calculus','calc','precalc','precalculus','trig','trigonometry','statistics','stats','stat'],
    ['english','lit','literature','ela','writing','composition','comp','rhetoric','journalism','grammar'],
    ['science','sci','biology','bio','chemistry','chem','physics','phys','anatomy','physiology','environmental','geology','astronomy','apes'],
    ['history','hist','social','studies','government','gov','civics','econ','economics','geography','apush','apwh','ush'],
    ['spanish','french','german','latin','chinese','japanese','mandarin','italian','language','lang','esl','arabic'],
    ['art','arts','drawing','painting','ceramics','photography','design','studio','sculpture'],
    ['music','band','orchestra','choir','chorus','jazz','guitar','piano','theory'],
    ['pe','gym','physed','health','fitness','weights','athletics'],
    ['cs','computer','computers','coding','programming','code','compsci','tech','technology','robotics','engineering'],
    ['business','accounting','marketing','finance','economics']
  ];

  function qaEditDistance(a, b){
    if(Math.abs(a.length - b.length) > 2) return 3;
    const dp = [];
    for(let i=0;i<=a.length;i++){ dp[i] = [i]; }
    for(let j=1;j<=b.length;j++){ dp[0][j] = j; }
    for(let i=1;i<=a.length;i++){
      for(let j=1;j<=b.length;j++){
        dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1]===b[j-1] ? 0 : 1));
      }
    }
    return dp[a.length][b.length];
  }

  // how well does one typed word match one class-name word? (0 = no match)
  function qaWordMatch(t, w){
    if(t === w) return 1.5;
    if(t.length >= 3 && w.startsWith(t)) return 1.0;
    if(w.length >= 4 && t.length >= 3 && t.startsWith(w)) return 0.9;
    if(t.length >= 5 && qaEditDistance(t, w) <= (t.length >= 8 ? 2 : 1)) return 0.9;
    return 0;
  }

  function qaScoreClass(c, words, lw, used){
    const all = c.name.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    let sig = all.filter(x => !QA_CLASS_FILLER.has(x));
    if(!sig.length) sig = all;
    const acr1 = sig.map(x => x[0]).join('');
    const acr2 = all.map(x => x[0]).join('');
    // subject groups this class belongs to (any name word, or its prefix, is in the group)
    const syn = new Set();
    QA_GROUPS.forEach(g => {
      if(sig.some(w => g.some(gw => gw === w || (w.length >= 4 && gw.startsWith(w)) || (gw.length >= 4 && w.startsWith(gw))))){ g.forEach(gw => syn.add(gw)); }
    });
    let score = 0; const toks = [];
    for(let i=0;i<words.length;i++){
      if(used[i]) continue;
      const t = lw[i];
      if(t.length < 2 || QA_STOP.has(t)) continue;
      let s = 0;
      sig.forEach(w => { s = Math.max(s, qaWordMatch(t, w)); });
      if(t.length >= 2 && (t === acr1 || t === acr2) && t.length >= 2) s = Math.max(s, 2);
      if(!s){
        syn.forEach(gw => { const m = qaWordMatch(t, gw); if(m) s = Math.max(s, Math.min(m, 1) * 0.85); });
      }
      if(s){ score += s; toks.push(i); }
    }
    return { score, toks };
  }

  function parseQuick(text){
    const words = text.trim().split(/\s+/).filter(Boolean);
    const used = words.map(() => false);
    const lw = words.map(w => w.toLowerCase().replace(/[.,!?;:]+$/,''));
    let due = '', typeInfo = null, typeWord = '';

    for(let i=0;i<words.length;i++){
      const w = lw[i];
      if(w === 'today' || w === 'tonight'){ due = todayISO(); used[i] = true; }
      else if(w === 'tomorrow' || w === 'tmrw' || w === 'tmr'){ due = fmtISO(addDays(todayDate(),1)); used[i] = true; }
      else if(QA_DAY_ABBR.hasOwnProperty(w)){
        const prev = i > 0 ? lw[i-1] : '';
        const mod = prev === 'next' ? 'next' : '';
        due = qaNextWeekday(QA_DAY_ABBR[w], mod);
        used[i] = true;
        if(prev === 'next' || prev === 'this' || prev === 'coming') used[i-1] = true;
      }
      else if(/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(w)){
        const [m,d,y] = w.split('/').map(Number);
        let year = y ? (y < 100 ? 2000 + y : y) : todayDate().getFullYear();
        let dt = new Date(year, m-1, d);
        if(!y && dt < todayDate()) dt = new Date(year+1, m-1, d);
        if(!isNaN(dt.getTime()) && dt.getMonth() === m-1){ due = fmtISO(dt); used[i] = true; }
      }
      else if(w === 'in' && /^\d{1,2}$/.test(lw[i+1]||'') && /^days?$/.test(lw[i+2]||'')){
        due = fmtISO(addDays(todayDate(), Number(lw[i+1])));
        used[i] = used[i+1] = used[i+2] = true;
      }
      else if(!typeInfo){
        const t = QA_TYPES.find(x => x.re.test(w));
        if(t){ typeInfo = t; typeWord = (t.type === 'test' ? words[i].toLowerCase() : t.type); used[i] = true; }
      }
    }

    // class matching on remaining words
    let best = null, bestScore = 0, bestTokens = [];
    state.classes.forEach(c => {
      const r = qaScoreClass(c, words, lw, used);
      if(r.score > bestScore){ best = c; bestScore = r.score; bestTokens = r.toks; }
    });
    if(bestScore < 0.8){ best = null; bestTokens = []; }
    if(best){
      bestTokens.forEach(i => used[i] = true);
      const nameWords = best.name.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      lw.forEach((t,i) => { if(!used[i] && nameWords.indexOf(t) !== -1) used[i] = true; });
    }

    // leftover words → title
    let left = words.filter((w,i) => !used[i]);
    while(left.length && QA_STOP.has(left[0].toLowerCase())) left.shift();
    while(left.length && QA_STOP.has(left[left.length-1].toLowerCase())) left.pop();
    const parts = [best ? best.name : '', left.join(' '), typeWord].filter(Boolean);
    let title = parts.join(' ').trim() || text.trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);
    return { title, due, cls: best, type: typeInfo ? typeInfo.type : 'homework', exam: !!(typeInfo && typeInfo.exam) };
  }

  function quickPreviewText(raw, dueOverride){
    const p = parseQuick(raw);
    if(dueOverride) p.due = dueOverride;
    const when = p.due ? weekdayName(p.due).slice(0,3) + ' ' + shortDate(p.due) : 'no date';
    return (p.exam ? 'Exam' : 'Task') + ': ' + p.title + ' · ' + (p.cls ? p.cls.name : 'no class matched') + ' · ' + when;
  }

  function quickCommit(raw, dueOverride){
    const p = parseQuick(raw);
    if(dueOverride) p.due = dueOverride;
    if(p.exam){
      if(!p.due){ toast('Pick a date for this exam'); openExamModal(null, { name:p.title, classId: p.cls ? p.cls.id : '' }); return true; }
      state.exams.push({ id:uid(), name:p.title, classId: p.cls ? p.cls.id : null, date:p.due, time:'', location:'', topics:'', notes:'', created:Date.now() });
      logActivity('add', 'Added exam "' + p.title + '"');
      saveState();
      toast('Exam added — ' + shortDate(p.due), 'success');
      return true;
    }
    const a = newAssignment({ title:p.title, subject: p.cls ? p.cls.name : '', due:p.due, type:p.type });
    state.assignments.push(a);
    logActivity('add', 'Added "' + a.title + '"');
    saveState();
    toast('Added' + (p.due ? ' — due ' + shortDate(p.due) : ''), 'success');
    return true;
  }

  function bindQuickAdd(inId, dueId, btnId, prevId, after){
    const inp = byId(inId), due = dueId ? byId(dueId) : null, prev = byId(prevId);
    if(!inp) return;
    const upd = () => { const v = inp.value.trim(); prev.textContent = v ? quickPreviewText(v, due && due.value) : ''; };
    const go = () => {
      const raw = inp.value.trim(); if(!raw) return;
      if(quickCommit(raw, due && due.value)){ inp.value = ''; if(due) due.value = ''; prev.textContent = ''; if(after) after(); updateNavBadge(); }
    };
    inp.addEventListener('input', upd);
    if(due) due.addEventListener('change', upd);
    inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') go(); });
    byId(btnId).addEventListener('click', go);
  }

  function renderAssignmentGroups(){
    const container = byId('assignmentGroups');
    if(!container) return;
    const f = ui.assignFilter;
    let list = activeAssignments();
    if(f.status === 'active') list = list.filter(a=>!isDone(a));
    else if(f.status !== 'all') list = list.filter(a=>a.status===f.status);
    if(f.subject) list = list.filter(a=>subjectLabel(a)===f.subject);
    if(f.priority) list = list.filter(a=>a.priority===f.priority);
    if(f.type) list = list.filter(a=>a.type===f.type);
    if(f.tag) list = list.filter(a=>a.tags.includes(f.tag));

    const sortFns = {
      due: (a,b) => (a.due||'9999').localeCompare(b.due||'9999'),
      priority: (a,b) => (PRIORITY_WEIGHT[b.priority]||0) - (PRIORITY_WEIGHT[a.priority]||0),
      created: (a,b) => b.created - a.created,
      estimate: (a,b) => (b.estimate||0) - (a.estimate||0),
      subject: (a,b) => subjectLabel(a).localeCompare(subjectLabel(b))
    };
    list = list.slice().sort(sortFns[f.sort] || sortFns.due);

    if(!list.length){
      container.innerHTML = `<p class="empty-state">${activeAssignments().length ? 'Nothing matches these filters.' : 'Nothing on your docket yet.'}<br><button class="btn-secondary" onclick="__docket.openAssign(null)">Add an assignment</button></p>`;
      return;
    }

    function bucketFor(a){
      if(isDone(a)) return 'Completed';
      if(!a.due) return 'No due date';
      const diff = daysBetweenISO(todayISO(), a.due);
      if(diff < 0) return 'Overdue';
      if(diff === 0) return 'Today';
      if(diff <= 7) return 'This week';
      return 'Later';
    }
    const order = ['Overdue','Today','This week','Later','No due date','Completed'];
    const groups = {};
    list.forEach(a => { const b = bucketFor(a); (groups[b]=groups[b]||[]).push(a); });

    let html = '';
    order.forEach(b => {
      if(!groups[b]) return;
      html += `<div class="group"><p class="group-title ${b==='Overdue'?'overdue':''}">${b} <span class="group-count">${groups[b].length}</span></p>${groups[b].map(renderTaskRow).join('')}</div>`;
    });
    container.innerHTML = html;
  }

  function calStep(dir){
    if(ui.calView === 'month'){ ui.calDate = new Date(ui.calDate.getFullYear(), ui.calDate.getMonth()+dir, 1); }
    else if(ui.calView === 'week'){ ui.calDate = addDays(ui.calDate, dir*7); }
    else { ui.calDate = addDays(ui.calDate, dir); }
    renderCalendar();
  }

  function eventsForDate(iso){
    const evs = [];
    activeAssignments().forEach(a => { if(a.due === iso) evs.push({ kind:'assignment', id:a.id, title:a.title, done:isDone(a), overdue:isOverdue(a) }); });
    state.exams.forEach(e => { if(e.date === iso) evs.push({ kind:'exam', id:e.id, title:e.name }); });
    return evs;
  }

  function renderCalendar(){
    const body = byId('calBody');
    if(!body) return;
    if(ui.calView === 'month') renderCalMonth(body);
    else if(ui.calView === 'week') renderCalWeek(body);
    else renderCalDay(body);
  }

  function renderCalMonth(body){
    const d = ui.calDate;
    byId('calTitle').textContent = monthYear(d);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const weekStart = state.settings.weekStart || 1;
    let startOffset = (first.getDay() - weekStart + 7) % 7;
    const gridStart = addDays(first, -startOffset);
    const dowLabels = [];
    for(let i=0;i<7;i++){ dowLabels.push(addDays(gridStart,i).toLocaleDateString(undefined,{weekday:'short'})); }

    let html = `<div class="cal-grid">` + dowLabels.map(l=>`<div class="cal-dow">${l}</div>`).join('');
    for(let i=0;i<42;i++){
      const day = addDays(gridStart, i);
      const iso = fmtISO(day);
      const inMonth = day.getMonth() === d.getMonth();
      const evs = eventsForDate(iso);
      const isToday = iso === todayISO();
      html += `<div class="cal-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-date="${iso}">
        <div class="cal-daynum">${day.getDate()}</div>
        ${evs.map(e => `<div class="cal-event ${e.kind==='exam'?'exam-ev':(e.overdue?'overdue-ev':'')}" data-ev="${e.kind}:${e.id}">${escapeHtml(e.title)}</div>`).join('')}
      </div>`;
      if(i%7===6 && i<41) {} // continue grid
    }
    html += `</div>`;
    body.innerHTML = html;
    bindCalCells(body);
  }

  function renderCalWeek(body){
    const weekStart = state.settings.weekStart || 1;
    const d = ui.calDate;
    let offset = (d.getDay() - weekStart + 7) % 7;
    const start = addDays(d, -offset);
    byId('calTitle').textContent = start.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' + addDays(start,6).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    let html = `<div class="cal-grid cal-week-row">` + Array.from({length:7}).map((_,i)=>`<div class="cal-dow">${addDays(start,i).toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('');
    for(let i=0;i<7;i++){
      const day = addDays(start,i); const iso = fmtISO(day);
      const evs = eventsForDate(iso);
      const isToday = iso===todayISO();
      html += `<div class="cal-cell ${isToday?'today':''}" data-date="${iso}">
        <div class="cal-daynum">${day.getDate()}</div>
        ${evs.map(e => `<div class="cal-event ${e.kind==='exam'?'exam-ev':(e.overdue?'overdue-ev':'')}" data-ev="${e.kind}:${e.id}">${escapeHtml(e.title)}</div>`).join('')}
      </div>`;
    }
    html += `</div>`;
    body.innerHTML = html;
    bindCalCells(body);
  }

  function renderCalDay(body){
    const iso = fmtISO(ui.calDate);
    byId('calTitle').textContent = ui.calDate.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
    const evs = eventsForDate(iso);
    const sched = scheduleForDate(iso);
    const dayLabel = specialDateEntry(iso) ? (sched[0] && sched[0].specialName) : (state.settings.scheduleMode==='ab' ? (abLetterForDate(iso) ? abLetterForDate(iso)+' day' : null) : null);
    body.innerHTML = `
      <div class="card"><p class="card-title">Classes${dayLabel?`<small>${escapeHtml(dayLabel)}</small>`:''}</p>${sched.length?sched.map(s=>`<div class="schedule-row"><span class="schedule-time">${fmtTime12(s.start)}</span><span class="class-dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</div>`).join(''):'<p class="empty-state">No classes.</p>'}</div>
      <div class="card"><p class="card-title">Due / exams <button class="btn-ghost" data-newat="${iso}">+ add</button></p>
      <div class="cal-day-list">${evs.length ? evs.map(e=>`<div class="task-row" data-ev="${e.kind}:${e.id}"><span class="priority-dot ${e.kind==='exam'?'high':'medium'}"></span> ${escapeHtml(e.title)}</div>`).join('') : `<p class="empty-state">Nothing due this day.</p>`}</div></div>
    `;
    bindCalCells(body);
  }

  function bindCalCells(body){
    qsa('.cal-cell[data-date]', body).forEach(cell => {
      cell.addEventListener('click', (e) => {
        if(e.target.closest('[data-ev]')) return;
        __docket.calNewAt(cell.dataset.date);
      });
    });
    qsa('[data-ev]', body).forEach(evEl => {

      });
    });
    const newAtBtn = qs('[data-newat]', body);
    if(newAtBtn) newAtBtn.addEventListener('click', () => __docket.calNewAt(newAtBtn.dataset.newat));
  }

     SPECIAL DAY SCHEDULES (short days, advisory days, etc.)

  function openSpecialScheduleModal(id){
    const existing = id ? getSpecialSchedule(id) : null;
    const t = existing ? { id: existing.id, name: existing.name, blocks: existing.blocks.map(b=>Object.assign({},b)) } : { id: uid(), name:'', blocks:[] };
    const isNew = !existing;
    function rowsHtml(){
      return t.blocks.length ? t.blocks.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(b => `
        <div class="blk-row" data-bid="${b.id}">
          <input type="time" class="blk-s" value="${b.start}">
          <input type="time" class="blk-e" value="${b.end}">
          <div class="blk-what">
            <select class="blk-cls"><option value="">Custom label&hellip;</option>${state.classes.map(c=>`<option value="${c.id}" ${b.classId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
            <input type="text" class="blk-label" placeholder="e.g. Advisory, Assembly" value="${escapeHtml(b.label||'')}">
          </div>
          <button type="button" class="task-delete blk-del" aria-label="Remove">&times;</button>
        </div>`).join('') : '<p class="empty-state">No blocks yet — add one below.</p>';
    }
    function readRowsIntoModel(){
      qsa('#ssBlockList .blk-row').forEach(row => {
        const b = t.blocks.find(x=>x.id===row.dataset.bid); if(!b) return;
        b.start = row.querySelector('.blk-s').value;
        b.end = row.querySelector('.blk-e').value;
        b.classId = row.querySelector('.blk-cls').value || null;
        b.label = row.querySelector('.blk-label').value.trim();
      });
    }
    openModal({
      title: isNew ? 'New special schedule' : 'Edit special schedule', large:true,
      bodyHtml: `
        <div class="field"><label>Name</label><input type="text" id="ssName" value="${escapeHtml(t.name)}" placeholder="e.g. Short Day, Advisory Day, Assembly Schedule"></div>
        <p class="card-title">Blocks</p>
        <div id="ssBlockList">${rowsHtml()}</div>
        <div class="blk-row">
          <input type="time" id="ssNewStart" value="09:00">
          <input type="time" id="ssNewEnd" value="09:30">
          <select id="ssNewCls"><option value="">Custom label&hellip;</option>${state.classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
          <span></span>
        </div>
        <div class="field"><input type="text" id="ssNewLabel" placeholder="Label (if not a class), e.g. Advisory"></div>
        <button class="btn-secondary btn-sm" type="button" id="ssAddBlock">+ Add block</button>
      `,
      footerHtml: `<div>${isNew?'':'<button class="btn-danger btn-sm" id="ssDeleteTemplate">Delete</button>'}</div>
        <div class="modal-footer-right"><button class="btn-ghost" id="ssCancelTemplate">Cancel</button><button class="btn-primary" style="width:auto;" id="ssSaveTemplate">${isNew?'Create':'Save'}</button></div>`,
      onMount(){
        byId('ssCancelTemplate').addEventListener('click', closeModal);
        function bindRemovals(){
          qsa('.blk-del', byId('ssBlockList')).forEach(btn => btn.addEventListener('click', () => {
            readRowsIntoModel();
            const row = btn.closest('[data-bid]');
            t.blocks = t.blocks.filter(b=>b.id!==row.dataset.bid);
            byId('ssBlockList').innerHTML = rowsHtml();
            bindRemovals();
          }));
        }
        bindRemovals();
        byId('ssAddBlock').addEventListener('click', () => {
          readRowsIntoModel();
          const start = byId('ssNewStart').value, end = byId('ssNewEnd').value;
          const classId = byId('ssNewCls').value || null;
          const label = byId('ssNewLabel').value.trim();
          if(!start || !end){ toast('Set a start and end time','error'); return; }
          if(!classId && !label){ toast('Give the block a label or link it to a class','error'); return; }
          t.blocks.push({ id:uid(), start, end, classId, label });
          byId('ssBlockList').innerHTML = rowsHtml();
          bindRemovals();
          byId('ssNewLabel').value = '';
        });
        if(!isNew) byId('ssDeleteTemplate').addEventListener('click', () => {
          confirmDialog('Delete "'+t.name+'"? Any dates using it will be unassigned.', { confirmLabel:'Delete', onConfirm(){
            state.specialSchedules = state.specialSchedules.filter(x=>x.id!==t.id);
            state.specialDates = state.specialDates.filter(x=>x.templateId!==t.id);
            saveState(); closeModal(); renderCurrentView(); toast('Special schedule deleted');
          }});
        });
        byId('ssSaveTemplate').addEventListener('click', () => {
          readRowsIntoModel();
          const name = byId('ssName').value.trim();
          if(!name){ toast('Give it a name','error'); return; }
          if(!t.blocks.length){ toast('Add at least one block','error'); return; }
          t.name = name;
          if(isNew){ state.specialSchedules.push(t); }
          else{ const orig = getSpecialSchedule(t.id); orig.name = t.name; orig.blocks = t.blocks; }
          saveState(); closeModal(); renderCurrentView(); toast(isNew?'Special schedule created':'Saved','success');
        });
      }
    });
  }

  function renderSpecialDaysTab(el){
    const templates = state.specialSchedules || [];
    const dates = (state.specialDates || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
    el.innerHTML = `
      <div class="card">
        <p class="card-title">Special-day schedules <button class="btn-secondary btn-sm" type="button" id="newSpecialSchedBtn">+ New</button></p>
        ${templates.length ? templates.map(t => `
          <div class="sp-item">
            <div><span class="sp-name">${escapeHtml(t.name)}</span> <span class="settings-row-hint">${t.blocks.length} block${t.blocks.length===1?'':'s'}</span></div>
            <div class="sp-actions"><button class="btn-ghost" data-edit-t="${t.id}">Edit</button></div>
          </div>`).join('') : '<p class="empty-state">No special schedules yet. Add one for a short day, advisory day, assembly, or any day that doesn\'t follow the normal schedule.</p>'}
      </div>
      <div class="card">
        <p class="card-title">Assign to dates <small>bulk-add short days, advisory days &amp; more</small></p>
        ${templates.length ? `
          <div class="field"><label>Schedule to apply</label><select id="bulkTemplate">${templates.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}</select></div>
          <p class="field-label" style="margin-top:2px;">By date range</p>
          <div class="field-row3">
            <div class="field"><label>From</label><input type="date" id="bulkFrom"></div>
            <div class="field"><label>To</label><input type="date" id="bulkTo"></div>
            <div class="field"><label>On these weekdays</label>
              <div class="day-strip">${['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>`<label class="chk"><input type="checkbox" value="${i+1}" checked> ${d}</label>`).join('')}</div>
            </div>
          </div>
          <button class="btn-secondary btn-sm" type="button" id="bulkAddRange">Add dates in range</button>
          <p class="field-label" style="margin-top:18px;">Or paste specific dates <span class="settings-row-hint">(one per line or comma-separated, YYYY-MM-DD)</span></p>
          <div class="field"><textarea id="bulkList" placeholder="2026-11-25, 2026-12-23"></textarea></div>
          <button class="btn-secondary btn-sm" type="button" id="bulkAddList">Add these dates</button>
        ` : `<p class="empty-state">Create a special schedule above first.</p>`}
      </div>
      <div class="card">
        <p class="card-title">Assigned special dates <small>${dates.length}</small></p>
        ${dates.length ? dates.map(d => {
          const t = getSpecialSchedule(d.templateId);
          return `<div class="sp-item"><div>${weekdayName(d.date)}, ${shortDate(d.date)}<span class="day-tag">${escapeHtml(t?t.name:'deleted schedule')}</span></div><div class="sp-actions"><button class="task-delete" data-del-date="${d.id}" aria-label="Remove">&times;</button></div></div>`;
        }).join('') : '<p class="empty-state">No dates assigned yet.</p>'}
      </div>
    `;
    byId('newSpecialSchedBtn').addEventListener('click', () => openSpecialScheduleModal(null));
    qsa('[data-edit-t]', el).forEach(b => b.addEventListener('click', () => openSpecialScheduleModal(b.dataset.editT)));
    qsa('[data-del-date]', el).forEach(b => b.addEventListener('click', () => {
      state.specialDates = state.specialDates.filter(x=>x.id!==b.dataset.delDate);
      saveState(); renderCurrentView(); toast('Removed');
    }));
    if(templates.length){
      byId('bulkAddRange').addEventListener('click', () => {
        const from = byId('bulkFrom').value, to = byId('bulkTo').value;
        const templateId = byId('bulkTemplate').value;
        if(!from || !to){ toast('Pick a start and end date','error'); return; }
        let d = parseISO(from); const end = parseISO(to);
        if(!d || !end || d > end){ toast('Check the date range','error'); return; }
        const allowed = qsa('.day-strip input:checked', el).map(cb=>Number(cb.value));
        let count = 0;
        while(d <= end){
          const iso = fmtISO(d);
          if(allowed.includes(d.getDay())){
            state.specialDates = state.specialDates.filter(x=>x.date!==iso);
            state.specialDates.push({ id:uid(), date:iso, templateId });
            count++;
          }
          d = addDays(d,1);
        }
        saveState(); renderCurrentView(); toast(count + ' date' + (count===1?'':'s') + ' added', count?'success':'error');
      });
      byId('bulkAddList').addEventListener('click', () => {
        const templateId = byId('bulkTemplate').value;
        const raw = byId('bulkList').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
        let count = 0;
        raw.forEach(txt => {
          if(!/^\d{4}-\d{2}-\d{2}$/.test(txt) || !parseISO(txt)) return;
          state.specialDates = state.specialDates.filter(x=>x.date!==txt);
          state.specialDates.push({ id:uid(), date:txt, templateId });
          count++;
        });
        if(!count){ toast('No valid dates found — use YYYY-MM-DD', 'error'); return; }
        saveState(); renderCurrentView(); toast(count + ' date' + (count===1?'':'s') + ' added', 'success');
      });
    }
  }

  function renderExamList(){
    const el = byId('examList'); if(!el) return;
    const upcoming = state.exams.filter(e => daysBetweenISO(todayISO(), e.date) >= 0).sort((a,b)=>a.date.localeCompare(b.date));
    const past = state.exams.filter(e => daysBetweenISO(todayISO(), e.date) < 0).sort((a,b)=>b.date.localeCompare(a.date));
    if(!state.exams.length){
      el.innerHTML = `<p class="empty-state">No exams tracked yet.<br><button class="btn-secondary" onclick="document.getElementById('examNewBtn').click()">Add an exam</button></p>`;
      return;
    }
    function card(e){
      const c = getClass(e.classId);
      const related = activeAssignments().filter(a=>a.classId===e.classId && !isDone(a)).length;
      const diff = daysBetweenISO(todayISO(), e.date);
      return `<div class="exam-card" data-id="${e.id}">
        <div class="exam-top">
          <div><div class="class-name" style="font-size:16px;">${escapeHtml(e.name)}</div><div class="class-meta">${c?escapeHtml(c.name)+' &middot; ':''}${shortDate(e.date)}${e.time?' &middot; '+fmtTime12(e.time):''}${e.location?' &middot; '+escapeHtml(e.location):''}</div></div>

        ${related ? `<div class="class-meta" style="margin-top:8px;">${related} related assignment${related===1?'':'s'} still open</div>` : ''}
      </div>`;
    }
    el.innerHTML = (upcoming.length ? `<p class="group-title">Upcoming</p>${upcoming.map(card).join('')}` : '<p class="empty-state">No upcoming exams.</p>') +
      (past.length ? `<p class="group-title" style="margin-top:20px;">Past</p>${past.map(card).join('')}` : '');
    qsa('.exam-card', el).forEach(c => c.addEventListener('click', () => openExamModal(c.dataset.id)));
  }

  /* =========================================================
     STATS / INSIGHTS
     ========================================================= */
  VIEW_RENDERERS.stats = function(){
    const el = byId('view-stats');
    const all = activeAssignments();
    const done = all.filter(isDone).length;
    const remaining = all.length - done;
    const pct = all.length ? Math.round((done/all.length)*100) : 0;
    const weekAgo = fmtISO(addDays(todayDate(),-7));
    const monthAgo = fmtISO(addDays(todayDate(),-30));
    const doneThisWeek = all.filter(a=>isDone(a)&&a.modified&&fmtISO(new Date(a.modified))>=weekAgo).length;
    const doneThisMonth = all.filter(a=>isDone(a)&&a.modified&&fmtISO(new Date(a.modified))>=monthAgo).length;
    const totalStudyMin = state.studySessions.filter(s=>s.completed).reduce((sum,s)=>sum+(s.actualMin||s.durationMin||0),0);
    const weekStudyMin = state.studySessions.filter(s=>s.completed && s.date>=weekAgo).reduce((sum,s)=>sum+(s.actualMin||s.durationMin||0),0);

    const bySubject = {};
    all.filter(a=>!isDone(a)).forEach(a => { const s = subjectLabel(a) || 'No subject'; bySubject[s] = (bySubject[s]||0)+1; });
    const subjectEntries = Object.entries(bySubject).sort((a,b)=>b[1]-a[1]);
    const maxSubj = Math.max(1, ...subjectEntries.map(e=>e[1]));

    const next7 = {};
    for(let i=0;i<7;i++){ next7[fmtISO(addDays(todayDate(),i))] = 0; }
    all.filter(a=>!isDone(a) && a.due && next7.hasOwnProperty(a.due)).forEach(a => next7[a.due]++);
    const maxWorkload = Math.max(1, ...Object.values(next7));

    el.innerHTML = `
      <div class="view-header"><div><h1 class="view-title">Insights</h1><p class="view-sub">A snapshot of your workload and habits.</p></div></div>
      <div class="grid-stats">
        <div class="stat-card"><div class="stat-num">${done}</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-num">${remaining}</div><div class="stat-label">Remaining</div></div>
        <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">Completion rate</div></div>
        <div class="stat-card"><div class="stat-num">${computeStreak()}</div><div class="stat-label">Day streak</div></div>
      </div>
      <div class="grid-2">
        <div>
          <div class="card"><p class="card-title">Workload by subject <small>active only</small></p>
            ${subjectEntries.length ? subjectEntries.map(([s,n]) => `<div class="bar-chart-row"><span class="bar-chart-label">${escapeHtml(s)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${(n/maxSubj)*100}%"></span></span><span class="bar-chart-val">${n}</span></div>`).join('') : '<p class="empty-state">Nothing active right now.</p>'}
          </div>
          <div class="card"><p class="card-title">Upcoming workload <small>next 7 days</small></p>
            ${Object.entries(next7).map(([iso,n]) => `<div class="bar-chart-row"><span class="bar-chart-label">${weekdayName(iso).slice(0,3)} ${shortDate(iso)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${(n/maxWorkload)*100}%"></span></span><span class="bar-chart-val">${n}</span></div>`).join('')}
          </div>
        </div>
        <div>
          <div class="card"><p class="card-title">Completed</p>
            <div class="bar-chart-row"><span class="bar-chart-label">This week</span><span class="bar-chart-val" style="width:auto;">${doneThisWeek}</span></div>
            <div class="bar-chart-row"><span class="bar-chart-label">This month</span><span class="bar-chart-val" style="width:auto;">${doneThisMonth}</span></div>
          </div>
          <div class="card"><p class="card-title">Study time</p>
            <div class="bar-chart-row"><span class="bar-chart-label">This week</span><span class="bar-chart-val" style="width:auto;">${weekStudyMin} min</span></div>
            <div class="bar-chart-row"><span class="bar-chart-label">All time</span><span class="bar-chart-val" style="width:auto;">${totalStudyMin} min</span></div>
          </div>
        </div>
      </div>
    `;
  };

      `,
      footerHtml: `<div>${isNew?'':'<button class="btn-danger btn-sm" id="ssDelete">Delete</button>'}</div>
        <div class="modal-footer-right"><button class="btn-ghost" id="ssCancel">Close</button><button class="btn-primary" style="width:auto;" id="ssSave">${isNew?'Save session':'Save'}</button></div>`,
      onMount(){
        stopTimer(true);
        let remaining = (s.durationMin||30) * 60;
        ui.timer = { interval:null, remaining, running:false };
        function updateClock(){ byId('timerClock').textContent = fmtClock(ui.timer.remaining); }
        byId('timerStart').addEventListener('click', () => {
          if(ui.timer.running) return;
          ui.timer.running = true;
          ui.timer.interval = setInterval(() => {
            ui.timer.remaining = Math.max(0, ui.timer.remaining - 1);
            updateClock();
            if(ui.timer.remaining === 0){ stopTimer(); toast('Time\u2019s up — nice work.'); }
          }, 1000);
        });
        byId('timerPause').addEventListener('click', () => stopTimer());
        byId('timerReset').addEventListener('click', () => { stopTimer(); ui.timer.remaining = Number(byId('ssDuration').value||30)*60; updateClock(); });
        byId('timerFinish').addEventListener('click', () => {
          const elapsedMin = Math.round((((Number(byId('ssDuration').value||30)*60) - ui.timer.remaining))/60);
          s.completed = true; s.actualMin = Math.max(elapsedMin, 1);
          stopTimer(true);
          persistSession();
          logActivity('study', 'Finished a study session' + (s.subject?(' — '+s.subject):''));
          toast('Study session logged', 'success');
          closeModal(); renderCurrentView();
        });
        byId('ssDuration').addEventListener('change', () => { ui.timer.remaining = Number(byId('ssDuration').value||30)*60; updateClock(); });
        byId('ssCancel').addEventListener('click', () => { stopTimer(true); closeModal(); });
        if(!isNew) byId('ssDelete').addEventListener('click', () => {
          confirmDialog('Delete this study session?', { confirmLabel:'Delete', onConfirm(){
            state.studySessions = state.studySessions.filter(x=>x.id!==s.id);
            saveState(); stopTimer(true); closeModal(); renderCurrentView(); toast('Session deleted');
          }});
        });
        function persistSession(){
          const cls = getClass(byId('ssClass').value);
          s.classId = cls?cls.id:null;
          s.subject = cls?cls.name:s.subject;
          s.assignmentId = byId('ssAssign').value || null;
          s.date = byId('ssDate').value;
          s.startTime = byId('ssStart').value;
          s.durationMin = Number(byId('ssDuration').value||30);
          if(isNew && !state.studySessions.find(x=>x.id===s.id)) state.studySessions.push(s);
          saveState();
        }
        byId('ssSave').addEventListener('click', () => {
          persistSession();
          toast('Session saved', 'success');
          stopTimer(true);
          closeModal(); renderCurrentView();
        });
      }
    });
  }
  function fmtClock(totalSec){ const m = Math.floor(totalSec/60), s = totalSec%60; return pad2(m)+':'+pad2(s); }
  function stopTimer(clear){
    if(ui.timer && ui.timer.interval){ clearInterval(ui.timer.interval); ui.timer.interval = null; ui.timer.running = false; }
    if(clear) ui.timer = null;
  }

  async function syncCanvas(){
    const domainRaw = byId('canvasDomainInput').value.trim();
    const tokenInput = byId('canvasTokenInput').value.trim();
    const token = tokenInput || state.settings.canvas.token;
    if(!domainRaw || !token){ byId('canvasStatus').textContent = 'Enter both your Canvas domain and access token.'; return; }
    const domain = domainRaw.replace(/^https?:\/\//i,'').replace(/\/+$/,'');
    state.settings.canvas.domain = domain;
    state.settings.canvas.token = token;
    saveState();
    const statusEl = byId('canvasStatus');
    statusEl.textContent = 'Syncing\u2026';
    byId('canvasSyncBtn').disabled = true;
    try{
      const coursesRes = await fetch(`https://${domain}/api/v1/courses?enrollment_state=active&per_page=100`, { headers:{ 'Authorization':'Bearer '+token } });
      if(!coursesRes.ok) throw new Error('Canvas returned ' + coursesRes.status + ' fetching courses');
      const courses = await coursesRes.json();
      if(!Array.isArray(courses)) throw new Error('Unexpected response from Canvas');
      let imported=0, updated=0;
      for(const course of courses){
        if(!course || !course.id || course.access_restricted_by_date) continue;
        const courseName = course.course_code || course.name || 'Canvas';
        let cls = state.classes.find(c => c.name.toLowerCase() === courseName.toLowerCase());
        if(!cls){
          cls = { id:uid(), name: courseName, teacher:'', room:'', color: CLASS_COLORS[state.classes.length % CLASS_COLORS.length], schedule:[], notes:'', created:Date.now(), fromCanvas:true };
          state.classes.push(cls);
        }
        let assignments = [];
        try{
          const aRes = await fetch(`https://${domain}/api/v1/courses/${course.id}/assignments?per_page=100&order_by=due_at`, { headers:{ 'Authorization':'Bearer '+token } });
          if(!aRes.ok) continue;
          assignments = await aRes.json();
        }catch(e){ continue; }
        assignments.forEach(a => {
          if(!a || !a.due_at) return;
          const cid = 'canvas-' + a.id;
          const due = a.due_at.slice(0,10);
          const existing = state.assignments.find(t => t.id===cid || t.canvasId===a.id);
          if(existing){
            existing.title = a.name || existing.title;
            existing.due = due;
            existing.classId = cls.id;
            existing.subject = cls.name;
            existing.modified = Date.now();
            updated++;
          } else {
            state.assignments.push(newAssignment({
              id: cid, title: a.name || 'Untitled assignment', classId: cls.id, subject: cls.name, due,
              status: a.has_submitted_submissions ? 'completed' : 'not-started',
              progress: a.has_submitted_submissions ? 100 : 0,
              source:'canvas', canvasId: a.id
            }));
            imported++;
          }
        });
      }
      state.settings.canvas.connected = true;
      state.settings.canvas.lastSynced = Date.now();
      logActivity('canvas', 'Synced Canvas — ' + imported + ' new, ' + updated + ' updated');
      saveState();
      statusEl.textContent = `Synced \u2014 ${imported} new, ${updated} updated. Last synced ${new Date(state.settings.canvas.lastSynced).toLocaleString()}.`;
      toast('Canvas synced', 'success');
      renderCurrentView();
    }catch(e){
      statusEl.textContent = 'Could not reach Canvas (' + e.message + '). Most schools block direct browser requests to Canvas from outside pages (CORS) \u2014 if this keeps failing, that\u2019s almost certainly why, and there isn\u2019t a workaround from a page like this one.';
    } finally {
      byId('canvasSyncBtn').disabled = false;
    }
  }

  /* ---------- import / export ---------- */
  function exportJson(){
    const payload = { exportedAt: new Date().toISOString(), user: currentUser, data: state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    downloadBlob(blob, 'docket-' + currentUserLabel.toLowerCase().replace(/\s+/g,'-') + '.json');
    toast('Exported JSON');
  }
  function exportCsv(){
    const rows = [['Title','Subject','Due Date','Due Time','Priority','Type','Status','Progress','Estimate (min)','Tags']];
    activeAssignments().forEach(a => rows.push([a.title, subjectLabel(a), a.due, a.dueTime, a.priority, a.type, a.status, a.progress, a.estimate||'', a.tags.join('; ')]));
    const csv = rows.map(r => r.map(v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    downloadBlob(blob, 'docket-assignments-' + currentUserLabel.toLowerCase().replace(/\s+/g,'-') + '.csv');
    toast('Exported CSV');
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  byId('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data ? parsed.data : parsed;
        if(!incoming || typeof incoming !== 'object') throw new Error('bad file');
        confirmDialog('Import this file? It will replace your current Docket data for ' + currentUserLabel + '.', {
          confirmLabel:'Import', onConfirm(){
            state = migrateState(Object.assign(defaultState(currentUser), incoming, { user: currentUser }));
            saveState(); renderCurrentView(); toast('Data imported', 'success');
          }
        });
      }catch(err){ toast('That file doesn\u2019t look like a valid Docket export.', 'error'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* =========================================================
     GLOBAL SEARCH
     ========================================================= */
  function openSearchModal(){
    openModal({
      title: 'Search', large:true,
      bodyHtml: `<input type="text" id="searchInput" class="search-input-lg" placeholder="Search assignments, classes, exams&hellip;">
        <div id="searchResults" style="margin-top:10px;"></div>`,
      onMount(){
        byId('searchInput').addEventListener('input', (e) => renderSearchResults(e.target.value.trim().toLowerCase()));
        byId('searchInput').addEventListener('keydown', (e) => { if(e.key==='Escape') closeModal(); });
        renderSearchResults('');
      }
    });
  }
  function renderSearchResults(q){
    const el = byId('searchResults'); if(!el) return;
    if(!q){ el.innerHTML = `<p class="empty-state">Type to search across everything in Docket.</p>`; return; }
    const results = [];
    activeAssignments().forEach(a => { if((a.title+' '+subjectLabel(a)+' '+a.tags.join(' ')).toLowerCase().includes(q)) results.push({ type:'Assignment', title:a.title, sub: subjectLabel(a), action:()=>openAssignmentModal(a.id) }); });
    state.classes.forEach(c => { if((c.name+' '+(c.teacher||'')).toLowerCase().includes(q)) results.push({ type:'Class', title:c.name, sub:c.teacher||'', action:()=>openClassDetail(c.id) }); });
    state.exams.forEach(ex => { if(ex.name.toLowerCase().includes(q)) results.push({ type:'Exam', title:ex.name, sub: shortDate(ex.date), action:()=>openExamModal(ex.id) }); });
    if(!results.length){ el.innerHTML = `<p class="empty-state">No results for "${escapeHtml(q)}".</p>`; return; }
    el.innerHTML = results.slice(0,30).map((r,i) => `<div class="search-result" data-i="${i}"><span class="search-result-type">${r.type}</span><span>${escapeHtml(r.title)}${r.sub?' — <span style="color:var(--muted);">'+escapeHtml(r.sub)+'</span>':''}</span></div>`).join('');
    qsa('.search-result', el).forEach((row,i) => row.addEventListener('click', () => { closeModal(); setTimeout(()=>results[i].action(), 60); }));
  }

  function removeDemoData(){
    state.assignments = state.assignments.filter(a=>!a.demo);
    state.classes = state.classes.filter(c=>!c.demo);
    state.exams = state.exams.filter(e=>!e.demo);
    state.studySessions = state.studySessions.filter(s=>!s.demo);
    state.ui.demo = false;
  }

  /* =========================================================
     THEME
     ========================================================= */
  function applyTheme(){
    const t = state && state.settings ? state.settings.theme : 'system';
    let effective = t;
    if(t === 'system'){ effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', effective);
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(state && state.settings.theme==='system') applyTheme(); });
  }

  /* =========================================================
     INIT
     ========================================================= */
  renderLoginMode();
  applyTheme();
  if(sb){ sb.auth.onAuthStateChange((evt) => { if(evt === 'PASSWORD_RECOVERY'){ setTimeout(openNewPasswordModal, 900); } }); }
  restoreSession();
})();
