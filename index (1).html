<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Pearl Browser</title>
<style>
:root{--pearl:#eef0f2;--nacre:#f7f4f5;--ink:#1b2430;--mute:#667180;--line:#d5d9de;--sea:#4f8886;--rose:#d9b8c4;--lilac:#b9b7de}
@media(prefers-color-scheme:dark){:root{--pearl:#1c222b;--nacre:#232a35;--ink:#e8ebef;--mute:#98a2b0;--line:#323b48}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--pearl);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;padding:8px 10px;border-radius:9px 9px 0 0;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab.on{background:var(--nacre);color:var(--ink)}
.tab button,.tool{border:0;background:none;color:inherit;cursor:pointer;border-radius:6px;font:inherit}
.tab button{width:20px;height:20px;line-height:1}
.tab button:hover,.tool:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#plus{margin:0 4px 4px;width:28px;height:28px}
#bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--nacre)}
.tool{width:32px;height:32px;font-size:17px}
#url{flex:1;height:34px;border:1px solid var(--line);border-radius:17px;padding:0 16px;background:var(--pearl);color:var(--ink);font:inherit;outline:none}
#url:focus{border-color:var(--sea);box-shadow:0 0 0 3px color-mix(in srgb,var(--sea) 25%,transparent)}
#sheen{height:3px;background:linear-gradient(90deg,var(--rose),var(--lilac),var(--sea),var(--rose))}
#views{flex:1;position:relative;background:#fff}
#views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--pearl);padding:24px}
#home h1{margin:0;font:600 clamp(40px,8vw,76px)/1 "Iowan Old Style",Palatino,Georgia,serif;letter-spacing:-.02em}
#home h1 i{font-weight:400;background:linear-gradient(100deg,var(--rose),var(--lilac) 45%,var(--sea));-webkit-background-clip:text;background-clip:text;color:transparent}
#hq{width:min(560px,100%);height:48px;border-radius:24px;border:1px solid var(--line);padding:0 22px;font:16px system-ui;background:var(--nacre);color:var(--ink);outline:none}
#hq:focus{border-color:var(--sea)}
#home p{margin:0;color:var(--mute);max-width:46ch;text-align:center}
@media(max-width:600px){.tab{min-width:90px}}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button class="tool" id="back" title="Back" aria-label="Back">←</button>
  <button class="tool" id="fwd" title="Forward" aria-label="Forward">→</button>
  <button class="tool" id="reload" title="Reload" aria-label="Reload">↻</button>
  <button class="tool" id="homeBtn" title="Home" aria-label="Home">⌂</button>
  <input id="url" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
  <button class="tool" id="cfg" title="Server address" aria-label="Server address">⚙</button>
</div>
<div id="sheen"></div>
<div id="views">
  <div id="home">
    <h1>Tom <i>Pearl</i></h1>
    <input id="hq" placeholder="Search the web or type an address" autocomplete="off">
    <p id="hmsg">Pages load through your own Tom Pearl server.</p>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const tryLS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let SERVER=(tryLS('tom_server')||(location.protocol.startsWith('http')?location.origin:'http://localhost:8787')).replace(/\/$/,'');
let tabs=[],active=null,n=0;

function normalize(s){
  s=s.trim();
  if(/^https?:\/\//i.test(s))return s;
  if(!/\s/.test(s)&&/^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#]|$)/.test(s))return 'https://'+s;
  return 'https://html.duckduckgo.com/html/?q='+encodeURIComponent(s);
}
function host(u){try{return new URL(u).hostname}catch(e){return 'New tab'}}
function newTab(input){
  const f=document.createElement('iframe');
  f.setAttribute('allow','fullscreen; clipboard-write');
  f.hidden=true;$('#views').append(f);
  const t={id:++n,title:'New tab',url:'',frame:f};
  tabs.push(t);if(input)go(t,input);select(t);
}
function go(t,input){
  const url=normalize(input);
  t.url=url;t.title=host(url);
  t.frame.src=SERVER+'/proxy?url='+encodeURIComponent(url);
  if(t===active)select(t);else renderTabs();
}
function select(t){
  active=t;
  tabs.forEach(x=>x.frame.hidden=x!==t||!x.url);
  $('#home').hidden=!!t.url;
  $('#url').value=t.url;
  renderTabs();
  if(!t.url)$('#hq').focus();
}
function closeTab(t){
  const i=tabs.indexOf(t);t.frame.remove();tabs.splice(i,1);
  if(!tabs.length)return newTab();
  if(active===t)select(tabs[Math.min(i,tabs.length-1)]);else renderTabs();
}
function renderTabs(){
  const box=$('#tabs');box.textContent='';
  tabs.forEach(t=>{
    const d=document.createElement('div');d.className='tab'+(t===active?' on':'');
    const s=document.createElement('span');s.textContent=t.title;
    const x=document.createElement('button');x.textContent='×';x.title='Close tab';
    x.onclick=e=>{e.stopPropagation();closeTab(t)};
    d.onclick=()=>select(t);d.append(s,x);box.append(d);
  });
  const p=document.createElement('button');p.id='plus';p.className='tool';p.textContent='+';p.title='New tab';
  p.onclick=()=>newTab();box.append(p);
}
const cmd=c=>{if(active&&active.url)active.frame.contentWindow.postMessage({tom:'cmd',c},'*')};
$('#back').onclick=()=>cmd('back');
$('#fwd').onclick=()=>cmd('forward');
$('#reload').onclick=()=>cmd('reload');
$('#homeBtn').onclick=()=>{active.url='';active.title='New tab';active.frame.src='about:blank';select(active)};
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){go(active,e.target.value);e.target.blur()}});
$('#url').addEventListener('focus',e=>e.target.select());
$('#hq').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){go(active,e.target.value);e.target.value=''}});
$('#cfg').onclick=()=>{
  const v=prompt('Address of your Tom Pearl server:',SERVER);
  if(v&&v.trim()){SERVER=v.trim().replace(/\/$/,'');tryLS('tom_server',SERVER);tabs.forEach(t=>t.url&&go(t,t.url))}
};
window.addEventListener('message',e=>{
  const d=e.data,t=tabs.find(t=>t.frame.contentWindow===e.source);
  if(!t||!d||d.tom!=='page')return;
  t.url=d.url;t.title=d.title||host(d.url);
  if(t===active)$('#url').value=t.url;
  renderTabs();
});
newTab();
</script>
</body>
</html>
